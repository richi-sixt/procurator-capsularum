[project]
name = "procurator-capsularum"
version = "0.1.0"
description = "Dateien umbenennen und konvertieren, mit Vorschau vor jeder Aktion."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.16.0",
    "rich>=14.0.0",
    "platformdirs>=4.2.0",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "tomli-w>=1.2.0",
    "httpx>=0.28.1",
]

[project.scripts]
pc = "procurator.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
    "ruff>=0.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procurator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
