[project]
name = "procurator-capsularum"
version = "1.0.0"
description = "Dateien umbenennen, verschieben und konvertieren"
license = "AGPL-3.0-or-later"
authors = [{ name = "Rüchan Sixt" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.16.0",
    "rich>=14.0.0",
    "platformdirs>=4.2.0",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "tomli-w>=1.2.0",
    "httpx>=0.28.1",
    "markdown-it-py>=3.0.0",
    "pypdf>=7.0.0",
    "pypdfium2>=5.15.1",
    "send2trash>=2.1.0",
]

[project.scripts]
pc = "procurator.cli:app"

[project.optional-dependencies]
claude = [
    "anthropic>=2.6.0",
]

[dependency-groups]
desktop = [
    "pyinstaller>=6.0",
]
dev = [
    "anthropic>=2.6.0",
    "httpx>=0.28.1",
    "pytest>=8.0.0",
    "ruff>=0.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procurator"]

[tool.hatch.build.targets.wheel.force-include]
"docs" = "procurator/docs"  # die Hilfe in der App liest diese Seiten

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
