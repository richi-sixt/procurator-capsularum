<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Procurator Capsularum">
  <rect width="64" height="64" rx="14" fill="#2b2f7e"/>
  <!-- Schriftrollen mit aufgerolltem Ende -->
  <g id="r" stroke="#2b2f7e" stroke-width="1.5">
    <g transform="rotate(-14 20 40)">
      <rect x="15" y="14" width="10" height="28" fill="#f4f1ff"/>
      <ellipse cx="20" cy="14" rx="5" ry="3" fill="#ffffff"/>
      <ellipse cx="20" cy="14" rx="2" ry="1.2" fill="none"/>
    </g>
    <g transform="rotate(14 44 40)">
      <rect x="39" y="14" width="10" height="28" fill="#f4f1ff"/>
      <ellipse cx="44" cy="14" rx="5" ry="3" fill="#ffffff"/>
      <ellipse cx="44" cy="14" rx="2" ry="1.2" fill="none"/>
    </g>
    <rect x="27" y="8" width="10" height="34" fill="#f4f1ff"/>
    <ellipse cx="32" cy="8" rx="5" ry="3" fill="#ffffff"/>
    <ellipse cx="32" cy="8" rx="2" ry="1.2" fill="none"/>
  </g>
  <!-- Rollenkapsel (Capsa): Zylinder mit Bändern -->
  <rect x="14" y="34" width="36" height="22" rx="4" fill="#f5a524"/>
  <rect x="14" y="34" width="36" height="5" rx="2.5" fill="#d98a0b"/>
  <rect x="14" y="51" width="36" height="5" rx="2.5" fill="#d98a0b"/>
</svg>
